version: "2"

run:
  timeout: 5m
  # Lint the integration tests too; they build only with this tag.
  build-tags:
    - integration

linters:
  default: none
  enable:
    - bidichk
    - bodyclose
    - contextcheck
    - dogsled
    - errcheck
    - prealloc
    - mnd
    - unconvert
    - asciicheck
    - exhaustive
    - copyloopvar
    - modernize
    - depguard
    - forbidigo
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - whitespace
    - gocritic
    - godox
    - goprintffuncname
    - govet
    - unused
    - lll
    - makezero
    - misspell
    - nilnil
    - noctx
    - staticcheck
    - predeclared
    - unparam
    - ineffassign
    - dupl
    - gocyclo
    - gocognit
  settings:
    lll:
      line-length: 156
    gocyclo:
      min-complexity: 30
    gocognit:
      min-complexity: 30
    dogsled:
      max-blank-identifiers: 2
    depguard:
      rules:
        # The dependency set is closed. Anything outside this list is a
        # defect. Add a dependency by editing this list in the same change.
        dependencies:
          list-mode: strict
          files:
            - $all
          allow:
            - $gostd
            - github.com/altessa-s/snctl
            - github.com/fsnotify/fsnotify
            - github.com/altessa-s/go-atlas-core
            - github.com/altessa-s/sncloud-go
            - github.com/altessa-s/snnote-go
            - github.com/altessa-s/snrender-go
            - github.com/altessa-s/snspd-go
            - github.com/spf13/cobra
            - github.com/coder/websocket
            - github.com/spf13/pflag
            - github.com/MakeNowJust/heredoc
            - golang.org/x/text
            - golang.org/x/term
            - github.com/mattn/go-runewidth
            - golang.org/x/sys
            - github.com/pelletier/go-toml/v2
            - github.com/keybase/go-keychain
        fsnotify-only-in-fswatch:
          files:
            - $all
            - "!**/internal/adapter/fswatch/*.go"
          deny:
            - pkg: github.com/fsnotify/fsnotify
              desc: only the directory watcher owns fsnotify
        websocket-only-in-tests:
          files:
            - $all
            - "!$test"
          deny:
            - pkg: github.com/coder/websocket
              desc: the websocket fixture belongs in tests
        native-reader-only-in-notes:
          files:
            - $all
            - "!**/internal/adapter/notes/*.go"
            - "!**/cmd/snctl/*integration_test.go"
          deny:
            - pkg: github.com/altessa-s/snnote-go
              desc: only the notes adapter imports the native reader
        native-drawing-reader-only-in-notes:
          files:
            - $all
            - "!**/internal/adapter/notes/*.go"
          deny:
            - pkg: github.com/altessa-s/snspd-go
              desc: only the notes adapter imports the drawing reader
        native-renderer-only-in-renderer:
          files:
            - $all
            - "!**/internal/adapter/renderer/*.go"
            - "!**/cmd/snctl/*integration_test.go"
          deny:
            - pkg: github.com/altessa-s/snrender-go
              desc: only the renderer adapter imports the native renderer
        # Production code decodes with encoding/json/v2, which refuses
        # duplicate keys, invalid UTF-8, and keys in another case.
        json-v2-only:
          files:
            - $all
            - "!$test"
          deny:
            - pkg: encoding/json$
              desc: use encoding/json/v2; v1 accepts duplicate keys and invalid UTF-8
        # The doubles and the emulated cloud stay out of production code.
        test-support-only-in-tests:
          files:
            - $all
            - "!$test"
            - "!**/internal/porttest/*.go"
            - "!**/internal/clouddouble/*.go"
          deny:
            - pkg: github.com/altessa-s/snctl/internal/porttest
              desc: test doubles are for tests
            - pkg: github.com/altessa-s/snctl/internal/clouddouble
              desc: the emulated cloud is for tests
        # The TOML parser reads the configuration file and nothing else.
        toml-only-in-config:
          files:
            - $all
            - "!**/internal/adapter/config/*.go"
          deny:
            - pkg: github.com/pelletier/go-toml/v2
              desc: only internal/adapter/config reads TOML
        # The rules below mirror architecture_test.go.
        # domain is the library model: no I/O, no transport, nothing else
        # from this module.
        domain-is-pure:
          files:
            - "**/internal/domain/*.go"
            - "!$test"
          deny:
            - pkg: github.com/altessa-s/snctl
              desc: domain imports nothing from this module
            - pkg: os
              desc: domain performs no I/O
            - pkg: net/http
              desc: domain knows nothing of the network
            - pkg: log/slog
              desc: domain returns what it would log
        # port declares contracts and imports nothing but domain.
        port-is-contracts:
          files:
            - "**/internal/port/*.go"
            - "!$test"
          deny:
            - pkg: github.com/altessa-s/snctl/internal/app
              desc: port imports nothing from this module but domain
            - pkg: github.com/altessa-s/snctl/internal/adapter
              desc: port imports nothing from this module but domain
            - pkg: os
              desc: port holds no implementation
        # The use cases reach the outside world only through ports.
        use-cases-see-only-ports:
          files:
            - "**/internal/app/**/*.go"
            - "!$test"
          deny:
            - pkg: github.com/altessa-s/snctl/internal/adapter
              desc: an adapter is wired by the composition root, not imported
            - pkg: github.com/altessa-s/snctl/internal/wiring
              desc: the use cases do not know how they are wired
            - pkg: net/http
              desc: the use cases perform no HTTP
            - pkg: os
              desc: local files go through port.LocalFiles
            - pkg: github.com/spf13/cobra
              desc: the command line is cmd/snctl
        # Adapters implement ports and know nothing of the use cases.
        adapters-know-no-use-case:
          files:
            - "**/internal/adapter/**/*.go"
            - "!$test"
          deny:
            - pkg: github.com/altessa-s/snctl/internal/app
              desc: adapters implement ports and import no use case
            - pkg: github.com/spf13/cobra
              desc: the command line is cmd/snctl
        # The command line sees the input ports and the model, nothing below.
        cli-sees-only-input-ports:
          files:
            - "**/cmd/snctl/commands/**/*.go"
            - "!$test"
          deny:
            - pkg: github.com/altessa-s/snctl/internal/app
              desc: commands call input ports; wiring builds them
            - pkg: github.com/altessa-s/snctl/internal/adapter
              desc: commands call input ports; wiring builds them
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.Now$
          msg: time comes from clock.Clock; the composition root passes clock.Real()
        # Matched on the package path, so crypto/rand — which exposes the same
        # identifiers — stays allowed.
        - pattern: ^rand\.
          pkg: ^math/rand(/v2)?$
          msg: randomness comes from crypto/rand
    errcheck:
      check-type-assertions: true
      check-blank: false
    exhaustive:
      default-signifies-exhaustive: true
      package-scope-only: false
    goconst:
      min-len: 3
      match-constant: true
      numbers: true
    staticcheck:
      checks: ["all", "-ST1003"]
    mnd:
      ignored-functions:
        - strings.SplitN
        - strconv.*
        - make
    govet:
      enable-all: true
      disable:
        - fieldalignment
    makezero:
      always: false
    misspell:
      locale: US
    varnamelen:
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-names:
        - err
        - ch
        - ok
      ignore-decls:
        - i int
        - ch chan
  exclusions:
    generated: lax
    rules:
      # Test files are held to the layering (depguard) and to the two
      # character checks, which are cheap and clean on them; the style and
      # complexity linters stay off for tests, as before tests were linted.
      - path: ".*_test\\.go"
        linters: [bodyclose, contextcheck, dogsled, errcheck, prealloc, mnd, unconvert, exhaustive, copyloopvar, modernize, forbidigo, gochecknoglobals, gochecknoinits, goconst, whitespace, gocritic, godox, goprintffuncname, govet, unused, lll, makezero, misspell, nilnil, noctx, staticcheck, predeclared, unparam, ineffassign, dupl, gocyclo, gocognit]

formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(google.golang.org)
        - prefix(golang.org)
        - prefix(github.com/altessa-s/go-atlas-core)
        - prefix(github.com/altessa-s/go-atlas-net)
        - prefix(github.com/altessa-s/snctl)
        - prefix(github.com/altessa-s)
        - blank
        - alias
