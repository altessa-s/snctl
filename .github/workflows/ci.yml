name: CI
on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      CC: clang
      CGO_ENABLED: '1'
    steps:
      - name: Install Cairo and C23 compiler
        run: |
          apt-get update
          apt-get install -y ca-certificates git clang make python3 ruby pkg-config libcairo2-dev libfreetype-dev libgdk-pixbuf-2.0-dev zlib1g-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      # The container runs as root over a workspace the runner owns, and git
      # refuses such a tree; go build needs git to stamp the version.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Download Go modules
        shell: bash
        run: |
          go mod download
          go -C devtools mod download
      - name: Fetch pinned PDFium
        run: bash .github/scripts/setup-pdfium.sh
      - run: make golangci
      - run: make golangci-lite
      - run: make coverage-gate COVERAGE_TAGS=integration
      - run: go test -race -shuffle=on -tags=norender,integration ./...
      - run: make vet
      - run: make dupl-check
      - run: make security-scan
      - run: bash .github/scripts/test-commit-validation.sh
      - run: bash .github/scripts/test-release.sh
      - run: bash .github/scripts/test-release-build.sh
      - run: bash .github/scripts/test-go-licenses.sh
      - run: bash .github/scripts/test-bench-workflow.sh
      - run: bash .github/scripts/test-windows-tools.sh
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Download Go modules
        shell: bash
        run: |
          go mod download
          go -C devtools mod download
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-zlib
      - name: Set up Windows PDFium
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash .github/scripts/setup-render-windows.sh
      - name: Windows native tests
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CGO_ENABLED: '1'
          CC: gcc
        run: |
          export PATH="$PDFIUM_BIN:$PATH"
          go vet ./...
          go test -race -shuffle=on -tags=integration ./...
      - if: runner.os != 'Windows'
        run: go test -race -shuffle=on -tags=integration ./...
  macos-keychain:
    timeout-minutes: 30
    runs-on: macos-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Download Go modules
        shell: bash
        run: |
          go mod download
          go -C devtools mod download
      - run: go test -race -tags=integration ./internal/adapter/keychain/...
  lite:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Download Go modules
        shell: bash
        run: |
          go mod download
          go -C devtools mod download
      - run: make golangci-lite
      - run: go test -tags=integration ./...
      - run: go test ./...
      - run: make build-nocgo
  cross-compile:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Download Go modules
        shell: bash
        run: |
          go mod download
          go -C devtools mod download
      - run: go build ./...
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
  secrets:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks git --log-opts="--all" --redact --config .gitleaks.toml .
      - run: gitleaks dir --redact --config .gitleaks.toml .
